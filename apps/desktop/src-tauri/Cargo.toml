[package]
name = "zajil-desktop"
description = "Zajil Download Manager: the desktop interface (Tauri 2)"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/motalim-ai/zajil-download-manager"
publish = false
default-run = "zajil-desktop"

# A workspace of its own: building the engine and the command line never
# needs the GUI libraries (WebKitGTK on Linux). Every dependency is listed
# in docs/DEPENDENCIES.md.
[workspace]

[lib]
name = "zajil_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "zajil-desktop"
path = "src/main.rs"

[features]
# Test pages and fixed demo data for the screenshots and the image test of
# mixed names in CI. Never in a release build (checked in CI).
ui-test = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.0"
# The schedule window's time of day (`schedule.rs`), as zajil-core's.
jiff = "0.2.38"
# Dragging a finished file out of «Download complete» (`complete.rs`).
drag = "2.1.1"
serde = { version = "1.0.229", features = ["derive"] }
# The reports of the UI tests (`ui_test.rs`), and the tests.
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "rt-multi-thread", "macros", "signal"] }
ts-rs = "12.0.1"
zajil-core = { path = "../../../crates/zajil-core" }
# The batch window's patterns (`batch.rs`), as `zajil batch`'s.
zajil-grab = { path = "../../../crates/zajil-grab" }
zajil-host = { path = "../../../crates/zajil-host" }
zajil-i18n = { path = "../../../crates/zajil-i18n" }
zajil-platform = { path = "../../../crates/zajil-platform" }
tauri-plugin-single-instance = "2.5.4"

[dev-dependencies]
# Tauri's mock runtime, for the test that the UI test commands are not in
# a release build.
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3.27.0"
zajil-testserver = { path = "../../../crates/zajil-testserver" }

# Whether the desktop shows tray icons (`closing.rs`): already in the tree
# through tauri-plugin-notification, so no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"
