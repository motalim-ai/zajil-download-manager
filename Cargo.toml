[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/motalim-ai/zajil-download-manager"
publish = false

# Shared dependency versions. Every entry is listed with its license and
# reason in docs/DEPENDENCIES.md.
[workspace.dependencies]
dirs = "7.0.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
dunce = "1.0.5"
icu_properties = "2.4.0"
thiserror = "2.0.21"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
tempfile = "3.27.0"

# Workspace crates
zajil-platform = { path = "crates/zajil-platform" }
