# cargo-deny configuration — license, advisory, ban and source checks.
# Policy: docs/adr/0002-license.md. Every new dependency must also be recorded
# in docs/DEPENDENCIES.md.

[graph]
all-features = true
# Only the systems we ship for (ADR-0006). Dependencies used solely on other
# targets (for example wasm32) are not part of any Zajil build.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# Known vulnerabilities (RustSec) fail the build.
ignore = []

[licenses]
# Licenses compatible with GPL-3.0. Do not add a license here without an ADR
# update. GPL-2.0-only is intentionally absent (incompatible with GPL-3.0).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
exceptions = []
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished workspace crates (publish = false) are skipped.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
