[package]
name = "zajil-core"
description = "Zajil download engine (UI-less library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
icu_properties.workspace = true
jiff.workspace = true
dunce.workspace = true
thiserror.workspace = true
tokio.workspace = true
zajil-platform.workspace = true

[features]
# Lets tests trust their temporary CA (`Engine::with_test_root`). Enabled only
# by the dev-dependency below; never by a shipped binary (checked in CI).
test-support = []

[dev-dependencies]
zajil-core = { path = ".", features = ["test-support"] }
zajil-testserver.workspace = true
tempfile.workspace = true
