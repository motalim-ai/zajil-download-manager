<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زاجِل — تصميم M5.5 (تجربة IDM)</title>
<!--
  Zajil M5.5 design ("the IDM experience"): one direction, five windows,
  Arabic and English, light and dark. A static mock-up for the owner's
  review (#65), not app code.

  Clean room: the layout follows how IDM looks and works from its public
  screenshots and help pages only. No code, text, icon or picture from IDM
  or any other program. Colors and tokens are the app's own
  (apps/desktop/src/styles/app.css), the bird is assets/icon/zajil-mark.svg,
  and the icons are from Lucide (ISC license, see the notice at the end
  of the sprite below), used unchanged.

  Query string: ?lang=ar|en &theme=light|dark &win=all|main|add|info|progress|done
  &menu=1 (main window with its right-click menu open).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Tokens: copied as they are from apps/desktop/src/styles/app.css. */
:root {
  --bg: #eef3f8;
  --surface: #ffffff;
  --sunken: #f5f8fb;
  --side: #e4ecf4;
  --ink: #10263d;
  --muted: #4a5d72;
  --faint: #55687e;
  --line: #d8e2ec;
  --accent: #1c6cd0;
  --accent-ink: #ffffff;
  --feather: #2e9bff;
  --feather-2: #8adcff;
  --feather-bg: #dce7f2;
  --sel: #dcebfc;
  --amber: #8f5d00;
  --amber-fill: #b97800;
  --amber-bg: #fff1cc;
  --red: #b53232;
  --red-bg: #fbe4e4;
  --green: #136e4b;
  --green-fill: #17845a;
  --green-bg: #ddf3ea;
  --shadow: 0 1px 2px rgba(16, 38, 61, 0.06), 0 12px 32px -12px rgba(16, 38, 61, 0.25);
  --scrim: rgba(10, 24, 40, 0.38);
  /* New for M5.5 only: the window frame and the desktop behind it. */
  --frame: #dfe8f1;
  --desk: #c9d6e3;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #07111d;
  --surface: #0e2034;
  --sunken: #0b1a2b;
  --side: #0a1828;
  --ink: #e3eef9;
  --muted: #a3b8cf;
  --faint: #8aa2bd;
  --line: #1c3550;
  --accent: #8adcff;
  --accent-ink: #0a1828;
  --feather: #2e9bff;
  --feather-2: #8adcff;
  --feather-bg: #183453;
  --sel: #173a5c;
  --amber: #ffc94d;
  --amber-fill: #ffc94d;
  --amber-bg: #3a2c08;
  --red: #ff8a80;
  --red-bg: #3b1518;
  --green: #6fd9a8;
  --green-fill: #6fd9a8;
  --green-bg: #0f3426;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px -12px rgba(0, 0, 0, 0.6);
  --scrim: rgba(2, 8, 14, 0.6);
  --frame: #0a1828;
  --desk: #040b13;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--desk);
  color: var(--ink);
  font: 400 14px/1.6 "IBM Plex Sans Arabic", system-ui, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* Buttons, as .btn in app.css. */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface);
  padding: 6px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  min-height: 34px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.split { padding-inline-end: 8px; }
.btn.split .caret { border-inline-start: 1px solid var(--line); padding-inline-start: 6px; display: inline-flex; }
.btn .ico { width: 16px; height: 16px; }

/* ---------- Gallery ---------- */
.gallery { padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 36px; align-items: center; }
.bar {
  position: sticky; top: 0; z-index: 5; width: 100%;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar h1 { font-size: 16px; margin: 0; margin-inline-end: auto; display: flex; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--sel); font-weight: 600; }
figure { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
figcaption { color: var(--muted); font-size: 13px; max-width: 900px; text-align: center; }
.solo { padding: 28px; display: inline-block; }

/* ---------- A window: frame and title bar ---------- */
.win {
  background: var(--surface); border: 1px solid color-mix(in oklab, var(--line) 70%, #000 10%);
  border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  display: flex; flex-direction: column; position: relative;
}
.title {
  display: flex; align-items: center; gap: 10px; height: 36px;
  padding-inline: 12px 0; background: var(--frame); border-bottom: 1px solid var(--line);
  font-size: 13px; user-select: none;
}
.title .mark { width: 20px; height: 20px; color: var(--accent); flex: none; }
.title .t { flex: 1; min-width: 0; font-weight: 600; }
.title .ctl { display: flex; height: 100%; }
.title .ctl span { width: 44px; display: grid; place-items: center; color: var(--muted); }
.title .ctl span:last-child:hover { background: var(--red); color: #fff; }
.title .ctl .ico { width: 15px; height: 15px; }

/* ---------- Main window ---------- */
.main { width: 1280px; height: 700px; }
.menubar { display: flex; gap: 2px; padding: 2px 8px; font-size: 13px; border-bottom: 1px solid var(--line); }
.menubar span { padding: 3px 10px; border-radius: 6px; }
.menubar span:first-child { background: var(--sel); }
.menubar u { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.toolbar { display: flex; align-items: stretch; gap: 2px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
.tb {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-width: 74px; padding: 6px 6px 4px; border-radius: 8px; border: 1px solid transparent;
  background: none; cursor: pointer; font-size: 12px; color: var(--ink); line-height: 1.3;
}
.tb:hover { background: var(--sunken); border-color: var(--line); }
.tb .tile {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: var(--feather-bg); color: var(--accent);
}
.tb .tile .ico { width: 22px; height: 22px; stroke-width: 1.7; }
.tb.go .tile { background: var(--green-bg); color: var(--green); }
.tb.stop .tile { background: var(--amber-bg); color: var(--amber); }
.tb.del .tile { background: var(--red-bg); color: var(--red); }
.tb.calm .tile { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.tb[aria-disabled="true"] { opacity: 0.45; }
.tsep { width: 1px; background: var(--line); margin: 6px 6px; }
.search {
  margin-inline-start: auto; align-self: center; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; width: 220px; color: var(--faint);
  background: var(--sunken); font-size: 13px;
}
.search kbd { margin-inline-start: auto; }
kbd {
  font: 500 11px/1.4 "IBM Plex Sans Arabic", system-ui, sans-serif; direction: ltr; unicode-bidi: isolate;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--surface);
}
.body { flex: 1; display: grid; grid-template-columns: 228px 1fr; min-height: 0; }
.tree { background: var(--side); border-inline-end: 1px solid var(--line); padding: 10px 8px; overflow: hidden; font-size: 13px; }
.tree h3 { font-size: 11.5px; font-weight: 600; color: var(--faint); margin: 12px 8px 2px; }
.node { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 7px; }
.node .ico { width: 16px; height: 16px; color: var(--muted); }
.node .tw { width: 14px; height: 14px; color: var(--faint); }
.node .tw.none { visibility: hidden; }
.node.on { background: var(--sel); font-weight: 600; }
.node .n { margin-inline-start: auto; color: var(--faint); font-size: 12px; }
.node small { color: var(--faint); font-size: 11px; }
.l1 { padding-inline-start: 26px; }
.l1 .ico { width: 15px; height: 15px; }

.list { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
.grid th {
  text-align: start; font-size: 12px; font-weight: 600; color: var(--faint);
  padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--surface);
  position: relative; white-space: nowrap;
}
.grid th + th::before { /* the column grip */
  content: ""; position: absolute; inset-block: 7px; inset-inline-start: 0; width: 1px; background: var(--line);
}
.grid th .sort { width: 12px; height: 12px; vertical-align: -1px; color: var(--accent); margin-inline-start: 4px; }
.grid th.cols { width: 34px; padding: 0; text-align: center; }
.grid th.cols .ico { width: 15px; height: 15px; vertical-align: middle; }
.grid td {
  padding: 6px 10px; border-bottom: 1px solid color-mix(in oklab, var(--line) 60%, transparent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
}
.grid tr.sel td { background: var(--sel); }
.grid tr.focus td { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
.grid td.cols { padding: 0; }
.nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ft {
  width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: none;
  background: var(--sunken); color: var(--muted); border: 1px solid var(--line);
}
.ft .ico { width: 14px; height: 14px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.st { display: inline-flex; align-items: center; gap: 8px; }
.st .pct { min-width: 34px; font-size: 12px; }
.mini { display: inline-block; width: 64px; height: 6px; border-radius: 99px; background: var(--feather-bg); overflow: hidden; position: relative; }
.mini b { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: inherit; background: var(--feather); }
.st.done { color: var(--green); }
.st.paused { color: var(--amber); }
.st.paused .mini b { background: var(--amber-fill); }
.st.failed { color: var(--red); }
.st.waiting { color: var(--muted); }
.st .ico { width: 14px; height: 14px; }
.statusbar {
  display: flex; gap: 18px; align-items: center; padding: 5px 14px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); background: var(--surface);
}
.statusbar b { color: var(--ink); font-weight: 600; }
.statusbar .end { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; }

/* The right-click menu. */
.ctx {
  position: absolute; z-index: 3; width: 268px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--shadow); padding: 4px; font-size: 13px;
}
.ctx .it { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 6px; }
.ctx .it .ico { width: 15px; height: 15px; color: var(--muted); }
.ctx .it.hi { background: var(--sel); }
.ctx .it.bad { color: var(--red); }
.ctx .it.bad .ico { color: var(--red); }
.ctx .it kbd { margin-inline-start: auto; }
.ctx .it .more { margin-inline-start: auto; width: 14px; height: 14px; }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

/* ---------- Dialogs ---------- */
.dlg .content { padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 12px; }
.dlg .actions { display: flex; gap: 8px; padding: 14px 20px 18px; align-items: center; }
.dlg .actions .gap { margin-inline-start: auto; }
.field { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; }
.field > label { color: var(--muted); font-size: 13px; }
.inp {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--sunken);
  border-radius: 8px; padding: 6px 10px; min-height: 34px; min-width: 0;
}
.inp.focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); background: var(--surface); }
.inp .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Links and paths read from their start, left to right, in both languages. */
.inp .v.lv, .facts dd.lv { direction: ltr; text-align: left; }
.inp .ico { width: 16px; height: 16px; color: var(--faint); }
.inp.select .ico.caret { margin-inline-start: auto; }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row > .inp { flex: 1; }
.btn.sq { padding: 0; width: 34px; justify-content: center; }
.note { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.note .ico { width: 15px; height: 15px; }
.note.good { color: var(--green); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.box { width: 16px; height: 16px; border: 1.5px solid var(--faint); border-radius: 4px; display: grid; place-items: center; flex: none; }
.box.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.box .ico { width: 12px; height: 12px; stroke-width: 3; }

.add { width: 520px; }
.info { width: 640px; }
.info .content { display: grid; grid-template-columns: 1fr 150px; gap: 12px 20px; }
.info .fields { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.filecard {
  border: 1px solid var(--line); border-radius: 10px; background: var(--sunken);
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px; text-align: center;
  align-self: start;
}
.bigft {
  width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
  background: var(--feather-bg); color: var(--accent);
}
.bigft .ico { width: 28px; height: 28px; stroke-width: 1.6; }
.filecard .size { font-weight: 700; font-size: 16px; }
.filecard .kind { font-size: 12px; color: var(--muted); }
.menu-later {
  position: absolute; z-index: 3; width: 210px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--shadow); padding: 4px; font-size: 13px;
}

.prog { width: 600px; }
.tabs { display: flex; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.tabs span { padding: 6px 12px; border-radius: 8px 8px 0 0; color: var(--muted); border: 1px solid transparent; border-bottom: 0; margin-bottom: -1px; }
.tabs span.on { color: var(--ink); font-weight: 600; background: var(--surface); border-color: var(--line); }
.facts { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts dd.yes { color: var(--green); font-weight: 600; }
.bigbar { height: 14px; border-radius: 99px; background: var(--feather-bg); overflow: hidden; position: relative; }
.bigbar b { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: inherit; }
.bigbar b:dir(rtl) { background: linear-gradient(to left, var(--feather), var(--feather-2)); }
.bigbar b:dir(ltr) { background: linear-gradient(to right, var(--feather), var(--feather-2)); }
.details { border-top: 1px solid var(--line); padding: 12px 20px 4px; display: flex; flex-direction: column; gap: 10px; background: var(--sunken); }
.details h4 { margin: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.details h4 .n { margin-inline-start: auto; font-weight: 400; }
.parts { display: flex; gap: 2px; height: 18px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--feather-bg); }
.parts i { position: relative; background: var(--feather-bg); }
.parts i b { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--feather); }
.parts i.done b { background: var(--feather); }
.parts i b::after { /* where this part is writing now */
  content: ""; position: absolute; inset-block: 0; inset-inline-end: 0; width: 3px; background: var(--feather-2);
}
.parts i.done b::after { display: none; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
table.conn { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.conn th { text-align: start; font-weight: 600; color: var(--faint); font-size: 11.5px; padding: 5px 10px; border-bottom: 1px solid var(--line); }
.conn td { padding: 4px 10px; border-bottom: 1px solid color-mix(in oklab, var(--line) 60%, transparent); }
.conn tr:last-child td { border-bottom: 0; }
.conn .ok { color: var(--green); }
.conn .wait { color: var(--muted); }

.done { width: 540px; }
.done .head { display: flex; gap: 14px; align-items: center; }
.done .badge { width: 48px; height: 48px; border-radius: 99px; background: var(--green-bg); color: var(--green); display: grid; place-items: center; flex: none; }
.done .badge .ico { width: 26px; height: 26px; stroke-width: 2.4; }
.done .head .nm2 { min-width: 0; display: flex; flex-direction: column; }
.done .head .big { font-weight: 700; font-size: 15px; }
</style>
</head>

// ---------- Mixed names: the rule of apps/desktop/src/lib/fname.ts ----------
const RTL = /[֐-ٟ٭-ۯۺ-ࣿיִ-﷿ﹰ-ﻼ]/;
const LATIN = /[A-Za-zÀ-ɏͰ-ϿЀ-ӿ]/;
const OPENING = /[(\[{"'«]/;
const STUCK = /[0-9_.\-]/;
const JOINER = /[_.\-]/;
function nameParts(name) {
  const m = /^(.*?)((?:\.tar)?\.[A-Za-z0-9]{1,8})$/.exec(name);
  if (!m) return { head: name, tail: "" };
  const stem = m[1], ext = m[2];
  let lastRtl = -1;
  for (let i = stem.length - 1; i >= 0; i--) if (RTL.test(stem[i])) { lastRtl = i; break; }
  if (lastRtl < 0) return { head: name, tail: "" };
  let firstLatin = -1;
  for (let i = lastRtl + 1; i < stem.length; i++) if (LATIN.test(stem[i])) { firstLatin = i; break; }
  if (firstLatin < 0) return { head: name, tail: "" };
  let cut = firstLatin;
  while (cut > lastRtl + 1 && STUCK.test(stem[cut - 1])) cut--;
  while (cut < firstLatin && JOINER.test(stem[cut])) cut++;
  while (cut > lastRtl + 1 && OPENING.test(stem[cut - 1])) cut--;
  return { head: stem.slice(0, cut), tail: stem.slice(cut) + ext };
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function fname(name, cls = "fn") {
  const p = nameParts(name);
  return `<bdi dir="auto" class="${cls}" title="${esc(name)}">${esc(p.head)}${p.tail ? `<bdi dir="ltr">${esc(p.tail)}</bdi>` : ""}</bdi>`;
}
const ltr = (s, cls = "") => `<bdi dir="ltr" class="${cls}">${esc(s)}</bdi>`;
// The arrow that points along the reading direction (a closed branch, a submenu).
const fwd = (lang) => (lang === "ar" ? "chevron-left" : "chevron-right");
const ico = (n, cls = "") => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

// ---------- Numbers, as apps/desktop/src/lib/format.ts ----------
const KIB = 1024, MIB = 1024 * KIB, GIB = 1024 * MIB;
const UNITS = { ar: ["بايت", "كيلوبايت", "ميجابايت", "جيجابايت"], en: ["B", "KiB", "MiB", "GiB"] };
function num(lang, n, f = 1) { return new Intl.NumberFormat(`${lang}-u-nu-latn`, { maximumFractionDigits: f }).format(n); }
function size(lang, b) {
  const u = UNITS[lang];
  if (b >= GIB) return `${num(lang, b / GIB)} ${u[3]}`;
  if (b >= MIB) return `${num(lang, b / MIB, b >= 100 * MIB ? 0 : 1)} ${u[2]}`;
  if (b >= KIB) return `${num(lang, b / KIB, 0)} ${u[1]}`;
  return `${num(lang, b, 0)} ${u[0]}`;
}
const speed = (lang, b) => `${size(lang, b)}/${lang === "ar" ? "ث" : "s"}`;
const pct = (lang, f) => new Intl.NumberFormat(`${lang}-u-nu-latn`, { style: "percent" }).format(Math.floor(f * 100) / 100);
const LEFT = {
  ar: (m) => (m === 1 ? "دقيقة واحدة" : m === 2 ? "دقيقتان" : m <= 10 ? `${m} دقائق` : `${m} دقيقةً`),
  en: (m) => (m === 1 ? "1 minute" : `${m} minutes`),
};

function titlebar(t, lang, opts = {}) {
  const ctl = opts.small ? ["x"] : ["minus", "square", "x"];
  return `<div class="title">${opts.mark === false ? "" : `<svg class="mark" aria-hidden="true"><use href="#zajil-mark"/></svg>`}<span class="t fn">${t}</span>
    <span class="ctl">${ctl.map((n) => `<span>${ico(n)}</span>`).join("")}</span></div>`;
}

// ---------- 1. Main window ----------
function mainWin(lang, withMenu) {
  const t = T[lang];
  const tbIcons = ["link-2", "play", "pause", "octagon-pause", "trash-2", "list-x", "settings", "calendar-clock", "list-start", "list-end"];
  const tbKind = ["", "go", "stop", "stop", "del", "del", "calm", "calm", "go", "stop"];
  const tbKeys = ["Ctrl+N", "Ctrl+R", "Ctrl+P", "Ctrl+Shift+P", "Del", "Ctrl+Shift+Del", "Ctrl+,", "Ctrl+J", "F5", "Shift+F5"];
  const seps = new Set([1, 4, 6, 8]);
  let tb = "";
  t.tb.forEach((label, i) => {
    if (seps.has(i)) tb += `<span class="tsep"></span>`;
    tb += `<button class="tb ${tbKind[i]}" title="${label} (${tbKeys[i]})"><span class="tile">${ico(tbIcons[i])}</span>${label}</button>`;
  });
  const menus = t.menus.map(([a, b]) => `<span><u>${a}</u>${b}</span>`).join("");
  const cats = [
    ["film", t.catNames.video, 1, true],
    ["music", t.catNames.music, 1],
    ["file-text", t.catNames.docs, 2],
    ["package", t.catNames.apps, 2],
    ["archive", t.catNames.zip, 2],
  ];
  let tree = `<div class="node on">${ico("chevron-down", "tw")}${ico("layers")}${t.all}<span class="n num">8</span></div>`;
  tree += `<h3>${t.cats}</h3>`;
  for (const [ic, name, n, open] of cats) {
    tree += `<div class="node">${ico(open ? "chevron-down" : fwd(lang), "tw")}${ico(ic)}${name}<span class="n num">${n}</span></div>`;
    if (open) {
      tree += `<div class="node l1">${ico("circle-dashed")}${t.unfinished}<span class="n num">1</span></div>`;
      tree += `<div class="node l1">${ico("circle-check")}${t.finished}<span class="n num">0</span></div>`;
    }
  }
  tree += `<h3>${t.queues}</h3>`;
  tree += `<div class="node">${ico("chevron-down", "tw none")}${ico("list-ordered")}${t.q1}<span class="n num">2</span></div>`;
  tree += `<div class="node">${ico("chevron-down", "tw none")}${ico("calendar-clock")}<span>${t.q2}<br><small>${t.q2at}</small></span><span class="n num">1</span></div>`;

  const widths = [null, 96, 132, 108, 118, 118, 112];
  const head = `<tr>${t.cols.map((c, i) => `<th${widths[i] ? ` style="width:${widths[i]}px"` : ""}>${c}${i === 5 ? ico("chevron-down", "sort") : ""}</th>`).join("")}<th class="cols" title="${t.colsBtn}">${ico("columns-3")}</th></tr>`;
  const stCell = (r) => {
    if (r.st === "active") return `<span class="st"><span class="mini"><b style="inline-size:${r.f * 100}%"></b></span><span class="pct num">${pct(lang, r.f)}</span></span>`;
    if (r.st === "paused") return `<span class="st paused">${ico("pause")}${t.st.paused} <span class="num">${pct(lang, r.f)}</span></span>`;
    if (r.st === "done") return `<span class="st done">${ico("circle-check")}${t.st.done}</span>`;
    if (r.st === "failed") return `<span class="st failed">${ico("circle-alert")}${t.st.failed}</span>`;
    return `<span class="st waiting">${ico("list-ordered")}${t.st.waiting}</span>`;
  };
  const rows = ROWS.map((r, i) => {
    const cls = i === 0 ? "sel" : i === 1 ? "sel focus" : "";
    const last = r.last ? `${t[r.last[0]]} <span class="num">${r.last[1]}</span>` : "";
    return `<tr class="${cls}"><td><span class="nm"><span class="ft">${ico(r.cat)}</span>${fname(r.name)}</span></td>
      <td class="num">${size(lang, r.size)}</td><td>${stCell(r)}</td>
      <td class="num muted">${r.left ? LEFT[lang](r.left) : ""}</td><td class="num">${r.sp ? speed(lang, r.sp) : ""}</td>
      <td class="muted">${last}</td><td class="muted">${t.descs[i]}</td><td class="cols"></td></tr>`;
  }).join("");

  let menu = "";
  if (withMenu) {
    menu = `<div class="ctx" style="inset-block-start:250px;inset-inline-start:420px">${t.ctx.map((it) => {
      if (it === "-") return "<hr>";
      const [ic, label, key, bad] = it;
      const end = key === ">" ? ico(fwd(lang), "more") : key ? `<kbd>${key}</kbd>` : "";
      return `<div class="it ${bad || ""} ${label === t.ctx[0][1] ? "hi" : ""}">${ico(ic)}${label}${end}</div>`;
    }).join("")}</div>`;
  }
  return `<div class="win main" role="img" aria-label="${t.app}">
    ${titlebar(t.app, lang)}
    <div class="menubar">${menus}</div>
    <div class="toolbar">${tb}<span class="search">${ico("search")}${t.search}<kbd>Ctrl+F</kbd></span></div>
    <div class="body"><nav class="tree">${tree}</nav>
      <div class="list"><table class="grid"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>
    <div class="statusbar">${t.sb(8, 2, speed(lang, 11.3 * MIB))}<span class="end">${t.sbEnd}</span></div>
    ${menu}</div>`;
}

// ---------- 4. Progress, details shown ----------
function progWin(lang) {
  const t = T[lang];
  const done = FILE.size * FILE.f;
  const per = FILE.size / 8;
  // Each part's share written: 3 finished, 5 running.
  const parts = [1, 1, 0.71, 1, 0.44, 0.38, 0.29, 0.22];
  const bar = parts.map((p) => `<i class="${p >= 1 ? "done" : ""}" style="flex:1"><b style="inline-size:${p * 100}%"></b></i>`).join("");
  const conn = parts.map((p, i) => `<tr><td class="num">${i + 1}</td><td class="num">${size(lang, per * p)}</td>
      <td class="${p >= 1 ? "ok" : ""}">${p >= 1 ? t.connOk : t.connRecv}</td></tr>`).join("");
  const facts = [
    esc(URL1),
    t.receiving,
    `<span class="num">${size(lang, FILE.size)}</span>`,
    `<span class="num">${size(lang, done)} (${pct(lang, FILE.f)})</span>`,
    `<span class="num">${speed(lang, FILE.sp)}</span>`,
    `<span class="num">${LEFT[lang](3)}</span>`,
    t.yes,
  ];
  const title = `<span class="num">${pct(lang, FILE.f)}</span> ${fname(FILE.name)}`;
  return `<div class="win dlg prog">${titlebar(title, lang)}
    <div class="tabs">${t.progTabs.map((x, i) => `<span class="${i ? "" : "on"}">${x}</span>`).join("")}</div>
    <div class="content">
      <dl class="facts">${t.facts.map((f, i) => `<dt>${f}</dt><dd class="${i === 6 ? "yes" : i === 0 ? "lv" : ""}">${facts[i]}</dd>`).join("")}</dl>
      <div class="bigbar" role="img" aria-label="${pct(lang, FILE.f)}"><b style="inline-size:${FILE.f * 100}%"></b></div>
    </div>
    <div class="actions"><button class="btn">${ico("chevron-up")}${t.hide}</button><span class="gap"></span>
      <button class="btn">${ico("pause")}${t.pause}</button><button class="btn">${t.cancel}</button></div>
    <div class="details">
      <h4>${t.partsTitle}<span class="n">${t.partsN}</span></h4>
      <div class="parts" role="img" aria-label="${t.partsTitle}">${bar}</div>
      <div class="legend"><span><i style="background:var(--feather)"></i>${t.legendDone}</span><span><i style="background:var(--feather-2)"></i>${t.legendNow}</span><span><i style="background:var(--feather-bg);border:1px solid var(--line)"></i>${t.legendLeft}</span></div>
      <table class="conn"><thead><tr>${t.connCols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${conn}</tbody></table>
      <div style="height:10px"></div>
    </div></div>`;
}

// ---------- Page ----------
const q = new URLSearchParams(location.search);
let lang = q.get("lang") === "en" ? "en" : "ar";
let theme = q.get("theme") === "dark" ? "dark" : "light";
const win = q.get("win") || "all";
const WINS = { main: (l) => mainWin(l, q.get("menu") === "1"), add: addWin, info: infoWin, progress: progWin, done: doneWin };

function render() {
  const t = T[lang];
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "ar" ? "rtl" : "ltr";
  root.dataset.theme = theme;
  document.title = t.page;
  const el = document.getElementById("root");
  if (WINS[win]) {
    el.innerHTML = `<div class="solo" id="shot">${WINS[win](lang)}</div>`;
    return;
  }
  const seg = (name, vals) => `<span class="seg" role="group" aria-label="${t[name]}">${vals.map(([v, label]) =>
    `<button data-${name}="${v}" aria-pressed="${(name === "lang" ? lang : theme) === v}">${label}</button>`).join("")}</span>`;
  const shows = [mainWin(lang, false), mainWin(lang, true), addWin(lang), infoWin(lang), progWin(lang), doneWin(lang)];
  el.innerHTML = `<div class="bar"><h1><svg class="ico" style="color:var(--accent);width:22px;height:22px"><use href="#zajil-mark"/></svg>${t.page}</h1>
    ${seg("lang", [["ar", "العربية"], ["en", "English"]])}${seg("theme", [["light", t.light], ["dark", t.dark]])}</div>
    <div class="gallery">${shows.map((w, i) => `<figure>${w}<figcaption>${t.caps[i]}</figcaption></figure>`).join("")}</div>`;
  el.querySelectorAll("[data-lang]").forEach((b) => (b.onclick = () => { lang = b.dataset.lang; render(); }));
  el.querySelectorAll("[data-theme]").forEach((b) => (b.onclick = () => { theme = b.dataset.theme; render(); }));
}
render();
