version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # The desktop app (M4): its npm packages, and its Tauri crates, which
  # are a Cargo workspace of their own.
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript API, and
      # svelte-check 4.7.7 accepts only ^5 || ^6 (#54). Remove this when
      # svelte-check supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
