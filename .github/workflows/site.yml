name: Website deploy

# Builds the site (site/) and publishes it on GitHub Pages, at
# zajil.by-wow.com (the custom domain is set in the repository's Pages
# settings). When the site, the screenshots or the icon change on main, when
# a release is published, once a day (for the download count), or by hand.
# The CI job "Website" checks the same build on every pull request.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "assets/icon/**"
      - "apps/desktop/src-tauri/icons/32x32.png"
      - "apps/desktop/src-tauri/icons/128x128@2x.png"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  # The download count (site/downloads.mjs), once a day.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one waits rather than cutting an older one off.
concurrency:
  group: pages
  cancel-in-progress: false

# Every third-party action is pinned to a full commit SHA, with its release
# tag in a comment, as in ci.yml.

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # check.mjs builds site/dist first, then fails on a broken link, a
      # missing twin page, or anything loaded from outside the site.
      - name: Build and check the site
        run: node site/check.mjs
      # How many times the installers were downloaded, from GitHub's own
      # counts (downloads.json). A failure leaves the count out, not the site.
      - name: Count the downloads
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/downloads.mjs site/dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
