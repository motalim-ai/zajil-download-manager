# Zajil's installers, built by CI only (AGENTS.md §7).
#
# A pull request that changes this workflow or scripts/release builds every
# installer and the extension, and tries them (artifacts only). A tag
# v<version> on main does the same and makes a DRAFT GitHub release with
# SHA256SUMS: nothing is published until the owner publishes the draft.
#
# Owner's decision (2026-10-25): Zajil is not signed by Apple or Microsoft.
# macOS gets an ad-hoc signature only; Windows is not signed.
#
# The app's own tauri.conf.json is not changed: scripts/release/
# tauri.release.json is merged into it here (`tauri build --config`). It
# sets the version, puts zajil-host (the app looks for it there, lib.rs
# `host_beside`) and the `zajil` command next to the program as Tauri
# sidecars, ships the GPL licence as a file in every installer (not as a
# licence to agree to: the GPL asks for no acceptance), asks for the ad-hoc signature on macOS
# and a per-user installer on Windows.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths: [.github/workflows/release.yml, scripts/release/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One version everywhere: the release config, both extension
      # manifests, and the tag when there is one.
      - id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version scripts/release/tauri.release.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $version"; exit 1; }
          for m in apps/extension/src/manifest.chrome.json apps/extension/src/manifest.firefox.json; do
            [ "$(jq -r .version "$m")" = "$version" ] || { echo "::error::$m is not $version"; exit 1; }
          done
          # A release also needs, before half an hour of builds: the tag, the
          # workspace version (`zajil --version`, the User-Agent), its
          # CHANGELOG section and its release page.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not name version $version"; exit 1; }
            grep -qx "version = \"$version\"" Cargo.toml || { echo "::error::the workspace version in Cargo.toml is not $version"; exit 1; }
            grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
            test -f "docs/releases/v$version.md" || { echo "::error::docs/releases/v$version.md is missing"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Zajil $version"

  desktop:
    name: Installer (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # The oldest Ubuntu the owner supports (22.04), so the programs
          # need no newer glibc than it has.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install && rustup show active-toolchain
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install the GUI libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          set -euo pipefail
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      # zajil-host, the program the browsers start (ADR-0005), and the zajil
      # command, named as Tauri wants a sidecar: binaries/<name>-<target>.
      # On macOS the build script of each processor's half wants its own
      # file, and the bundle the universal one made from both.
      - name: Build zajil-host and zajil
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          bin=apps/desktop/src-tauri/binaries
          mkdir -p "$bin"
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked -p zajil-host -p zajil-cli --target "$t"
              for p in zajil-host zajil; do cp "target/$t/release/$p" "$bin/$p-$t"; done
            done
            for p in zajil-host zajil; do
              lipo -create -output "$bin/$p-universal-apple-darwin" "$bin/$p-aarch64-apple-darwin" "$bin/$p-x86_64-apple-darwin"
              lipo -archs "$bin/$p-universal-apple-darwin"
            done
          else
            cargo build --release --locked -p zajil-host -p zajil-cli --target "${{ matrix.target }}"
            ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
            for p in zajil-host zajil; do
              cp "target/${{ matrix.target }}/release/$p$ext" "$bin/$p-${{ matrix.target }}$ext"
            done
          fi
          ls -l "$bin"
      - name: Install npm packages (from the lock file only)
        working-directory: apps/desktop
        run: npm ci
      - name: Build the installers
        working-directory: apps/desktop
        env:
          # linuxdeploy (AppImage) runs without FUSE on the CI machine.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          npx tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" \
            --config ../../scripts/release/tauri.release.json
      - name: Collect the installers
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/installers"
          mkdir -p "$out"
          b="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$b" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} "$out/" \;
          ls -l "$out"
          n=$(ls "$out" | wc -l)
          expected=1; [ "$RUNNER_OS" = Linux ] && expected=2
          [ "$n" -eq "$expected" ] || { echo "::error::expected $expected installers, found $n"; exit 1; }
          for f in "$out"/*; do
            case "$(basename "$f")" in *"$VERSION"*) ;; *) echo "::error::$f does not carry $VERSION"; exit 1 ;; esac
          done
      # Each installer is tried on its own system: it installs, zajil-host is
      # next to the program, and it uninstalls.
      - name: Try the macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls "$RUNNER_TEMP"/installers/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app="$mnt/Zajil.app"
          ls -l "$app/Contents/MacOS"
          test -x "$app/Contents/MacOS/zajil-host"
          test -x "$app/Contents/MacOS/zajil"
          test -f "$app/Contents/Resources/LICENSE"
          "$app/Contents/MacOS/zajil" --version
          # Every program in the bundle runs on both processors.
          for f in "$app"/Contents/MacOS/*; do
            archs=$(lipo -archs "$f")
            echo "$(basename "$f"): $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$f is not universal"; exit 1 ;; esac
          done
          # Ad-hoc, and nothing else (owner's decision).
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"
          hdiutil detach "$mnt"
      - name: Try the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\installers\*-setup.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # A per-user install goes to %LOCALAPPDATA%\Zajil.
          $dir = Join-Path $env:LOCALAPPDATA 'Zajil'
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in @('zajil-desktop.exe', 'zajil-host.exe', 'zajil.exe', 'LICENSE')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is not in $dir" }
          }
          & (Join-Path $dir 'zajil.exe') --version
          # `_?=` keeps the uninstaller in place, so -Wait waits for it.
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait
          foreach ($f in @('zajil-desktop.exe', 'zajil-host.exe', 'zajil.exe')) {
            if (Test-Path (Join-Path $dir $f)) { throw "$f is still there after uninstall" }
          }
      - name: Try the Linux package
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls "$RUNNER_TEMP"/installers/*.deb)
          dpkg-deb -c "$deb"
          package=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y -q "$deb"
          test -x /usr/bin/zajil-host
          test -x /usr/bin/zajil
          /usr/bin/zajil --version
          dpkg -L "$package" | grep -q '/LICENSE$'
          sudo apt-get remove -y -q "$package"
          test ! -e /usr/bin/zajil-host
          appimage=$(ls "$RUNNER_TEMP"/installers/*.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/zajil-host
          test -x squashfs-root/usr/bin/zajil
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error

  extension:
    name: Browser extension
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - run: npm run build
      # Firefox: the file to upload to addons.mozilla.org as "unlisted" (the
      # owner uploads it; AMO signs it). Its linter must pass.
      - run: npm run lint
      # Chrome and Edge: unzipped and loaded with "Load unpacked". The
      # manifest is at the root of each zip.
      - name: Zip the extension
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/extension"
          mkdir -p "$out"
          (cd dist/chrome && zip -q -r -X "$out/zajil-extension-chrome-edge-$VERSION.zip" .)
          (cd dist/firefox && zip -q -r -X "$out/zajil-extension-firefox-$VERSION.zip" .)
          for z in "$out"/*.zip; do unzip -l "$z" | grep -q ' manifest.json$'; done
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: ${{ runner.temp }}/extension/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only reviewed code is released: the tag is on main's history.
      - name: The tag is a merged commit
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main: only merged code is released"; exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Files and SHA256SUMS
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/release"
          mkdir -p "$r"
          find "$RUNNER_TEMP/artifacts" -type f -exec cp {} "$r/" \;
          (cd "$r" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          [ "$(wc -l < "$r/SHA256SUMS")" -eq 6 ] || { echo "::error::expected 6 files"; exit 1; }
      # A draft: visible to the repository's maintainers only, published by
      # the owner by hand after trying it. A pre-release (0.x is a test
      # build); the update check reads /releases, which lists those.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --verify-tag \
            --title "Zajil $VERSION (test build)" \
            --notes-file "docs/releases/v$VERSION.md" "$RUNNER_TEMP"/release/*
