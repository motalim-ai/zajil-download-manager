name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every third-party action is pinned to a full commit SHA, with its release
# tag in a comment. Dependabot (.github/dependabot.yml) proposes updates.
# The Rust version comes from rust-toolchain.toml.

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)(\([a-z0-9._-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add resume support'"
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo fmt --all -- --check

  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # Release builds have no overflow checks, so arithmetic on untrusted
      # input (HTTP dates, ranges, state files) is tested there too.
      - name: Test engine in release mode
        run: cargo test --release --locked -p zajil-core --lib --test resume
      # `test-support` lets tests trust their temporary CA. Only
      # dev-dependencies may enable it; a release build must not contain it.
      - name: Release build has no test-only features
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --workspace --bins
          # Write the graph to a file first: if `cargo tree` itself fails
          # (for example after a rename), `set -e` stops the step here
          # instead of letting an empty search look like success.
          cargo tree --locked --workspace -e normal,build,features -i zajil-core > release-features.txt
          if ! grep -q '^zajil-core v' release-features.txt; then
            echo "::error::cargo tree did not list zajil-core; the check cannot run"
            exit 1
          fi
          if grep 'test-support' release-features.txt; then
            echo "::error::a release build enables zajil-core/test-support"
            exit 1
          fi
          echo "zajil-core/test-support is off in release builds"

  licenses:
    name: Licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
