name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main, so the multi-connection benchmark
  # (crates/zajil-core/tests/parallel.rs) runs even when nothing changes.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Tests never shut down or put to sleep the runner: they use a mock, and
  # with this set the real PowerControl refuses anyway (owner's decision on
  # M3; checked by crates/zajil-cli/tests/power_guard.rs).
  ZAJIL_NO_POWER_ACTIONS: "1"

# Every third-party action is pinned to a full commit SHA, with its release
# tag in a comment. Dependabot (.github/dependabot.yml) proposes updates.
# The Rust version comes from rust-toolchain.toml.

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)(\([a-z0-9._-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add resume support'"
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the private-key check below.
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      # The extension's private key never enters the repository (owner's
      # decision on #7): not in the files, not in the history. The check is
      # shown to refuse each kind of test key first.
      - name: No private key in the repository
        run: |
          bash scripts/test-check-no-private-keys.sh
          bash scripts/check-no-private-keys.sh

  # Our LGPL ffmpeg and ffprobe, and the test-only ffmpeg-testgen, for the
  # video tests (ADR-0009, section 8). Only ffmpeg-testgen is cached there;
  # ffmpeg and ffprobe are built again on every run, on all five platforms
  # (caching them, and building only the three test platforms from here,
  # is a follow-up issue).
  video-tools:
    name: Video tools
    uses: ./.github/workflows/ffmpeg.yml

  build-test:
    name: Build & test (${{ matrix.os }})
    needs: video-tools
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # USB drives use FAT32 or exFAT, where hard links and (on macOS exFAT)
      # the no-replace rename are refused. Tests in zajil-platform and
      # zajil-core run on a small image of each and fail on CI without them.
      - name: Mount FAT32 and exFAT test volumes (Linux)
        if: runner.os == 'Linux'
        # A slow package mirror once hung this step for over 20 minutes.
        timeout-minutes: 10
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          set -euo pipefail
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends dosfstools exfatprogs exfat-fuse
          truncate -s 256M "$RUNNER_TEMP/fat32.img" "$RUNNER_TEMP/exfat.img"
          mkfs.vfat -F 32 -n ZFAT32 "$RUNNER_TEMP/fat32.img"
          mkfs.exfat -L ZEXFAT "$RUNNER_TEMP/exfat.img"
          sudo mkdir -p /mnt/zfat32 /mnt/zexfat
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" "$RUNNER_TEMP/fat32.img" /mnt/zfat32
          # The kernel's exFAT driver if this runner has it; otherwise the
          # FUSE one (the kernel module comes in a 51 MB package that a slow
          # mirror could not deliver in 10 minutes).
          if sudo modprobe exfat 2>/dev/null; then
            sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" "$RUNNER_TEMP/exfat.img" /mnt/zexfat
          else
            loop="$(sudo losetup --find --show "$RUNNER_TEMP/exfat.img")"
            sudo mount.exfat-fuse -o uid="$(id -u)",gid="$(id -g)",allow_other "$loop" /mnt/zexfat
          fi
          findmnt /mnt/zfat32
          findmnt /mnt/zexfat
          test "$(findmnt -no FSTYPE /mnt/zfat32)" = vfat
          case "$(findmnt -no FSTYPE /mnt/zexfat)" in exfat|fuseblk) ;; *) exit 1 ;; esac
          touch /mnt/zexfat/probe && rm /mnt/zexfat/probe
          echo "ZAJIL_TEST_FAT32=/mnt/zfat32" >> "$GITHUB_ENV"
          echo "ZAJIL_TEST_EXFAT=/mnt/zexfat" >> "$GITHUB_ENV"
      # The CLI tests run printed commands in sh, bash and zsh, and fail on
      # CI if one is missing instead of skipping it (owner's decision on
      # #28). Ubuntu runners have no zsh. Xvfb is the display for the real
      # clipboard test below.
      - name: Install zsh and Xvfb (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          set -euo pipefail
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends zsh xvfb xauth
          zsh -c 'echo "zsh $ZSH_VERSION"'
      - name: Mount FAT32 and exFAT test volumes (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          hdiutil create -quiet -size 256m -fs "MS-DOS FAT32" -volname ZFAT32 "$RUNNER_TEMP/fat32.dmg"
          hdiutil create -quiet -size 256m -fs ExFAT -volname ZEXFAT "$RUNNER_TEMP/exfat.dmg"
          hdiutil attach -quiet -nobrowse "$RUNNER_TEMP/fat32.dmg"
          hdiutil attach -quiet -nobrowse "$RUNNER_TEMP/exfat.dmg"
          mount | grep -q '/Volumes/ZFAT32 (msdos'
          mount | grep -q '/Volumes/ZEXFAT (exfat'
          echo "ZAJIL_TEST_FAT32=/Volumes/ZFAT32" >> "$GITHUB_ENV"
          echo "ZAJIL_TEST_EXFAT=/Volumes/ZEXFAT" >> "$GITHUB_ENV"
      - name: Mount FAT32 and exFAT test volumes (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fat = Join-Path $env:RUNNER_TEMP 'fat32.vhdx'
          $exfat = Join-Path $env:RUNNER_TEMP 'exfat.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'volumes.txt'
          @(
            "create vdisk file=`"$fat`" maximum=256 type=expandable"
            "select vdisk file=`"$fat`""
            'attach vdisk'
            'convert mbr'
            'create partition primary'
            'format fs=fat32 quick label=ZFAT32'
            'assign letter=Y'
            "create vdisk file=`"$exfat`" maximum=256 type=expandable"
            "select vdisk file=`"$exfat`""
            'attach vdisk'
            'convert mbr'
            'create partition primary'
            'format fs=exfat quick label=ZEXFAT'
            'assign letter=Z'
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart failed: $LASTEXITCODE" }
          if ((Get-Volume -DriveLetter Y).FileSystemType -ne 'FAT32') { throw 'Y: is not FAT32' }
          if ((Get-Volume -DriveLetter Z).FileSystemType -ne 'exFAT') { throw 'Z: is not exFAT' }
          'ZAJIL_TEST_FAT32=Y:\' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'ZAJIL_TEST_EXFAT=Z:\' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The real tools for crates/zajil-core/tests/video_real.rs: our builds
      # from the job above, and yt-dlp by its pin (the same pins.txt Zajil
      # reads). The tests fail on the CI if any is missing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ matrix.os == 'windows-latest' && 'windows-x86_64' || matrix.os == 'macos-latest' && 'macos-universal' || 'linux-x86_64' }}
          path: ${{ runner.temp }}/video-tools/ffmpeg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testgen-${{ matrix.os == 'windows-latest' && 'windows-x86_64' || matrix.os == 'macos-latest' && 'macos-universal' || 'linux-x86_64' }}
          path: ${{ runner.temp }}/video-tools/testgen
      - name: Video tools for the tests
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/video-tools"
          # Artifacts do not keep the executable bit.
          chmod 755 "$t"/ffmpeg/ffmpeg* "$t"/ffmpeg/ffprobe* "$t"/testgen/ffmpeg-testgen* "$t"/testgen/ffprobe-testgen*
          ytdlp="$(bash scripts/get-yt-dlp.sh "$t/yt-dlp")"
          "$ytdlp" --version
          {
            echo "ZAJIL_TEST_YT_DLP=$ytdlp"
            echo "ZAJIL_TEST_FFMPEG_DIR=$t/ffmpeg"
            echo "ZAJIL_TEST_FFMPEG_TESTGEN=$t/testgen"
          } >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # Clipboard monitoring (M5) reads the real clipboard: the test that
      # puts text there and reads it back is ignored by default, because it
      # replaces the clipboard of whoever runs it. Linux needs a display.
      # deny.toml leaves arboard's Windows backend (BSL-1.0) out of the
      # license check because no Zajil build contains it; this proves it.
      - name: arboard's Windows backend is in no build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin; do
            for manifest in Cargo.toml apps/desktop/src-tauri/Cargo.toml; do
              for crate in clipboard-win error-code; do
                found=$(cargo tree --locked --manifest-path "$manifest" --target "$target" -e all -i "$crate" 2>/dev/null || true)
                if [ -n "$found" ]; then echo "$crate is built for $target ($manifest):"; echo "$found"; exit 1; fi
              done
            done
          done
          echo "clipboard-win and error-code: in no build"
      - name: The real clipboard
        shell: bash
        run: |
          set -euo pipefail
          test=(cargo test --locked -p zajil-platform --lib -- --ignored --exact clipboard::tests::text_put_on_the_clipboard_is_read_back)
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${test[@]}"; else "${test[@]}"; fi
      # Release builds have no overflow checks, so arithmetic on untrusted
      # input (HTTP dates, ranges, state files) is tested there too.
      - name: Test engine in release mode
        run: cargo test --release --locked -p zajil-core --lib --test resume --test state_file
      # `test-support` lets tests trust their temporary CA. Only
      # dev-dependencies may enable it; a release build must not contain it.
      - name: Release build has no test-only features
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --workspace --bins
          # Write the graph to a file first: if `cargo tree` itself fails
          # (for example after a rename), `set -e` stops the step here
          # instead of letting an empty search look like success.
          cargo tree --locked --workspace -e normal,build,features -i zajil-core > release-features.txt
          if ! grep -q '^zajil-core v' release-features.txt; then
            echo "::error::cargo tree did not list zajil-core; the check cannot run"
            exit 1
          fi
          if grep 'test-support' release-features.txt; then
            echo "::error::a release build enables zajil-core/test-support"
            exit 1
          fi
          echo "zajil-core/test-support is off in release builds"

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        working-directory: .
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # Tauri 2 on Linux needs WebKitGTK 4.1 (the minimum the owner chose:
      # Ubuntu 22.04 and Debian 12). Xvfb, xdotool and ImageMagick are for
      # opening the real window and taking its screenshots.
      - name: Install the GUI libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          set -euo pipefail
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool imagemagick
      - name: Install npm packages (from the lock file only)
        run: npm ci
      - name: Licenses and advisories of npm packages
        run: |
          npm run licenses
          npm audit --audit-level=high
      - name: Svelte check (accessibility warnings are errors)
        run: npm run check
      - name: Unit tests of the interface
        run: npm test
      # A release build of the page has no test page and no test command.
      - name: Release build has no UI test code
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          # Nothing of src/uitest: no chunk of its own (Names, its calls),
          # and none of its names in the page (owner's condition on #47).
          extra=$(find dist -name '*.js' ! -name 'index-*.js')
          if [ -n "$extra" ]; then
            echo "::error::the release build of the page has more than its own script:"
            echo "$extra"
            exit 1
          fi
          if grep -rl -i 'data-zajil-ui-test\|ui_test_\|uitest\|windowRect\|naiveDiffers\|axe-core\|axe\.run' dist; then
            echo "::error::the release build of the page contains UI test code"
            exit 1
          fi
          if grep -n '^default *=' src-tauri/Cargo.toml | grep ui-test; then
            echo "::error::ui-test is a default feature"
            exit 1
          fi
          # The window may be asked where it is only in a ui-test build.
          if ! grep -q '"capabilities": \["default"\]' src-tauri/tauri.conf.json; then
            echo "::error::the release build must enable only the default capability"
            exit 1
          fi
          echo "no UI test code in the release build"
      - name: Clippy (desktop)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features ui-test -- -D warnings
      - name: Tests (desktop) and generated types up to date
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked
          cargo test --locked --features ui-test --lib
          # Changed files by content (line endings aside, on Windows), and
          # new files too (review of #45: `git diff` alone missed them).
          git diff --exit-code -- ../src/lib/bindings
          new=$(git ls-files --others --exclude-standard -- ../src/lib/bindings)
          if [ -n "$new" ]; then
            echo "::error::new generated TypeScript types are not in the repository:"
            echo "$new"
            exit 1
          fi
      - name: Build the app
        shell: bash
        run: npx tauri build --debug --no-bundle
      # The program built without `ui-test` has no UI test command: not even
      # their names (owner's condition on #47). Calling them is an error, as
      # the unit test `the_ui_test_commands_exist_only_in_a_ui_test_build`
      # shows through Tauri's IPC in both builds.
      - name: The release program has no UI test commands
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) app=src-tauri/target/debug/zajil-desktop.exe ;;
            *) app=src-tauri/target/debug/zajil-desktop ;;
          esac
          if grep -c -a 'ui_test_scenario\|ui_test_report' "$app"; then
            echo "::error::the release program contains the UI test commands"
            exit 1
          fi
          echo "no UI test command in $app"
      # The built app opens its window and closes cleanly (exit code 0).
      - name: The app opens and closes
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) app=src-tauri/target/debug/zajil-desktop.exe ;;
            *) app=src-tauri/target/debug/zajil-desktop ;;
          esac
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/open-close.mjs "$app"
          else
            node scripts/open-close.mjs "$app"
          fi
      # Closed, or killed, in the middle of a download, then opened again:
      # the download goes on from its recorded progress and the file is
      # whole (src-tauri/tests/close_resume.rs, owner's request on #45).
      - name: Closing during a download, then opening again
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          # A copy of the app `tauri build` made: `cargo test` rebuilds the
          # binary in place without its page (review of #45).
          case "$RUNNER_OS" in
            Windows) built=target/debug/zajil-desktop.exe; export ZAJIL_DESKTOP_APP="$RUNNER_TEMP/zajil-desktop-test.exe" ;;
            *) built=target/debug/zajil-desktop; export ZAJIL_DESKTOP_APP="$RUNNER_TEMP/zajil-desktop-test" ;;
          esac
          cp "$built" "$ZAJIL_DESKTOP_APP"
          test=(cargo test --locked --test close_resume -- --ignored --test-threads 1 --nocapture)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" "${test[@]}"
          else
            "${test[@]}"
          fi
      - name: Build the app with its UI test pages
        shell: bash
        run: |
          npx tauri build --debug --no-bundle --features ui-test \
            --config '{"build":{"beforeBuildCommand":"npm run build:ui-test"},"app":{"security":{"capabilities":["default","ui-test"]}}}'
      # Screenshots of the real window, captured with each system's own
      # tool, and the image test of mixed names (owner's decision on the
      # M4 plan).
      - name: Screenshots, accessibility, language switch and the image test of mixed names
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) app=src-tauri/target/debug/zajil-desktop.exe ;;
            *) app=src-tauri/target/debug/zajil-desktop ;;
          esac
          shots="$RUNNER_TEMP/ui-shots"
          # Every screen in Arabic and English, light and dark, each with
          # its axe-core check, and the language switched in one session.
          scenarios="names switch-ar-light switch-en-dark"
          for screen in list add details refresh settings categories; do
            for lang in ar en; do
              for theme in light dark; do scenarios="$scenarios $screen-$lang-$theme"; done
            done
          done
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/ui-shots.mjs "$app" "$shots" $scenarios
          else
            node scripts/ui-shots.mjs "$app" "$shots" $scenarios
          fi
          node scripts/compare-names.mjs "$shots"
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: warn

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: Install npm packages (from the lock file only)
        run: npm ci
      # Build and lint tools only: nothing from npm goes into the extension.
      - name: Licenses and advisories of npm packages
        run: |
          node ../desktop/scripts/check-licenses.mjs
          npm audit --audit-level=high
      - name: Types (checkJs)
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build (Chrome and Edge, Firefox)
        run: npm run build
      # addons-linter is the linter `web-ext lint` runs, and AMO's.
      - name: Lint the Firefox build
        run: npm run lint
      - name: Upload the built extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zajil-extension
          path: apps/extension/dist
          if-no-files-found: error

  desktop-licenses:
    name: Desktop licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check
          arguments: --all-features

  licenses:
    name: Licenses & advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
