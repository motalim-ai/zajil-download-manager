name: FFmpeg

# Builds the ffmpeg and ffprobe that Zajil downloads on first video use
# (ADR-0009): FFmpeg's official source, signature and SHA-256 checked, LGPL,
# remux plus FFmpeg's own AAC encoder, on every system Zajil runs on. Also
# builds the test-only ffmpeg-testgen, cached and never released.
#
# A tag named tools-ffmpeg-<version>-<n> publishes a release with the
# binaries, the official source and its signature, the source with the
# build notes in its root, and every build file: the LGPL checklist of
# ADR-0009, section 1.
on:
  # main and the release tags; a PR is built through `pull_request`, once.
  push:
    branches: [main]
    paths: [tools/ffmpeg/**, .github/workflows/ffmpeg.yml]
    tags: ["tools-ffmpeg-*"]
  pull_request:
    paths: [tools/ffmpeg/**, .github/workflows/ffmpeg.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source (signature and SHA-256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/ffmpeg/get-source.sh "$RUNNER_TEMP/source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source
          path: ${{ runner.temp }}/source
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu, so it runs on glibc 2.35+.
          - { platform: linux-x86_64, os: ubuntu-22.04 }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm }
          - { platform: macos-universal, os: macos-latest }
          - { platform: windows-x86_64, os: windows-latest, msystem: UCRT64, cc: gcc }
          - { platform: windows-aarch64, os: windows-11-arm, msystem: CLANGARM64, cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-source
          path: ${{ runner.temp }}/source
      - name: Install MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          pacboy: >-
            ${{ matrix.cc }}:p
            make:
            diffutils:
      # The test-only build, rebuilt only when its source, options or
      # script change. Its own name and folder: it is never released.
      - name: Restore ffmpeg-testgen
        id: testgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-tools/ffmpeg-testgen
          key: ffmpeg-testgen-${{ matrix.platform }}-${{ hashFiles('tools/ffmpeg/source.env', 'tools/ffmpeg/configure-testgen.txt', 'tools/ffmpeg/build.sh', '.github/workflows/ffmpeg.yml') }}
      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          TESTGEN_HIT: ${{ steps.testgen.outputs.cache-hit }}
        run: |
          set -euo pipefail
          . tools/ffmpeg/source.env
          tarball="$RUNNER_TEMP/source/$FFMPEG_TARBALL"
          bash tools/ffmpeg/build.sh dist "$tarball" out
          [ "$TESTGEN_HIT" = true ] || bash tools/ffmpeg/build.sh testgen "$tarball" test-tools/ffmpeg-testgen
      - name: Build (macOS, arm64 and x86_64 in one file)
        if: runner.os == 'macOS'
        env:
          TESTGEN_HIT: ${{ steps.testgen.outputs.cache-hit }}
        run: |
          set -euo pipefail
          . tools/ffmpeg/source.env
          tarball="$RUNNER_TEMP/source/$FFMPEG_TARBALL"
          for arch in arm64 x86_64; do
            ZAJIL_FFMPEG_EXTRA="--arch=$arch
          --enable-cross-compile
          --target-os=darwin
          --extra-cflags=-arch $arch -mmacosx-version-min=11.0
          --extra-ldflags=-arch $arch -mmacosx-version-min=11.0" \
              bash tools/ffmpeg/build.sh dist "$tarball" "out-$arch"
            if [ "$TESTGEN_HIT" != true ]; then
              ZAJIL_FFMPEG_EXTRA="--arch=$arch
          --enable-cross-compile
          --target-os=darwin
          --extra-cflags=-arch $arch -mmacosx-version-min=11.0
          --extra-ldflags=-arch $arch -mmacosx-version-min=11.0" \
                bash tools/ffmpeg/build.sh testgen "$tarball" "testgen-$arch"
            fi
          done
          mkdir -p out test-tools/ffmpeg-testgen
          for tool in ffmpeg ffprobe; do
            lipo -create "out-arm64/$tool" "out-x86_64/$tool" -output "out/$tool"
            lipo -info "out/$tool"
          done
          # Ad-hoc signed (codesign -s -), never signed by Apple: the owner's
          # decision (ADR-0009, section 2). Zajil is to pin
          # the SHA-256 and check it before every run, and its tools carry no
          # quarantine mark, so Gatekeeper does not stop them.
          codesign --force --sign - out/ffmpeg out/ffprobe
          for tool in ffmpeg ffprobe; do
            codesign --verify --strict "out/$tool"
            info="$(codesign --display --verbose=2 "out/$tool" 2>&1)"
            grep -q '^Signature=adhoc$' <<< "$info" || { echo "::error::out/$tool is not ad-hoc signed"; echo "$info"; exit 1; }
          done
          # One build file for the universal binaries: both configure lines.
          { cat out-arm64/ffmpeg-build.txt; echo; cat out-x86_64/ffmpeg-build.txt; } > out/ffmpeg-build.txt
          if [ "$TESTGEN_HIT" != true ]; then
            for tool in ffmpeg-testgen ffprobe-testgen; do
              lipo -create "testgen-arm64/$tool" "testgen-x86_64/$tool" -output "test-tools/ffmpeg-testgen/$tool"
            done
          fi
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          TESTGEN_HIT: ${{ steps.testgen.outputs.cache-hit }}
          CC: ${{ matrix.cc }}
          # Static, so ffmpeg.exe needs no MinGW DLL next to it.
          ZAJIL_FFMPEG_EXTRA: |-
            --cc=${{ matrix.cc }}
            --extra-ldflags=-static
            --enable-w32threads
            --disable-pthreads
        run: |
          set -euo pipefail
          . tools/ffmpeg/source.env
          tarball="$(cygpath -u "$RUNNER_TEMP")/source/$FFMPEG_TARBALL"
          bash tools/ffmpeg/build.sh dist "$tarball" out
          [ "$TESTGEN_HIT" = true ] || bash tools/ffmpeg/build.sh testgen "$tarball" test-tools/ffmpeg-testgen
          # Only Windows' own DLLs, none from MinGW or MSYS2: the files run
          # on a plain Windows (objdump is MSYS2's).
          bash tools/ffmpeg/check-linked.sh out
      # What the real files load, on Linux and macOS (Windows: above).
      - name: Linked libraries
        if: runner.os != 'Windows'
        run: bash tools/ffmpeg/check-linked.sh out
      - name: Smoke test
        run: bash tools/ffmpeg/smoke-test.sh out test-tools/ffmpeg-testgen
      # The same test on the x86_64 half: under Rosetta a universal program
      # started from an x86_64 one runs its x86_64 half.
      - name: Smoke test (macOS, the x86_64 half under Rosetta)
        if: runner.os == 'macOS'
        run: ZAJIL_EXPECT_ARCH=x86_64 arch -x86_64 /bin/bash tools/ffmpeg/smoke-test.sh out test-tools/ffmpeg-testgen
      - name: Sizes and SHA-256
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.platform }}"
            echo
            echo "| File | Bytes | MiB | SHA-256 |"
            echo "|---|---|---|---|"
            for f in out/ffmpeg* out/ffprobe*; do
              case "$f" in *.txt) continue ;; esac
              bytes="$(wc -c < "$f" | tr -d ' ')"
              mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
              sum="$( (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | cut -d' ' -f1)"
              echo "| $(basename "$f") | $bytes | $mib | \`$sum\` |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/tools-ffmpeg-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only what was reviewed, under its own version: the tag is on main's
      # history, and names the pinned version (tools-ffmpeg-<version>-<n>).
      - name: The tag is a reviewed commit of the pinned version
        run: |
          set -euo pipefail
          . tools/ffmpeg/source.env
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main: only merged code is released"; exit 1
          }
          [[ "$GITHUB_REF_NAME" =~ ^tools-ffmpeg-${FFMPEG_VERSION//./\\.}-[0-9]+$ ]] || {
            echo "::error::$GITHUB_REF_NAME does not name FFmpeg $FFMPEG_VERSION (tools-ffmpeg-$FFMPEG_VERSION-<n>)"; exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Assemble the release files
        run: |
          set -euo pipefail
          . tools/ffmpeg/source.env
          a="$RUNNER_TEMP/artifacts"
          r="$RUNNER_TEMP/release"
          mkdir -p "$r"
          # The official source as it is, and its signature (items 3, 4, 7).
          cp "$a/ffmpeg-source/$FFMPEG_TARBALL" "$a/ffmpeg-source/$FFMPEG_TARBALL.asc" "$r/"
          # The binaries. FFmpeg's own names with the platform added, which
          # the legal page allows (item 16); Zajil saves them as ffmpeg and
          # ffprobe.
          for dir in "$a"/ffmpeg-*/; do
            platform="$(basename "$dir")"
            platform="${platform#ffmpeg-}"
            [ "$platform" = source ] && continue
            for f in "$dir"*; do
              name="$(basename "$f")"
              case "$name" in
                *testgen*) echo "::error::a test-only file reached the release: $name"; exit 1 ;;
                ffmpeg-build.txt) cp "$f" "$r/ffmpeg-build-$platform.txt" ;;
                *.exe) cp "$f" "$r/${name%.exe}-$platform.exe" ;;
                *) cp "$f" "$r/$name-$platform" ;;
              esac
            done
          done
          # The source again, with every build file in its root (item 6).
          work="$(mktemp -d)"
          tar -xJf "$r/$FFMPEG_TARBALL" -C "$work"
          cp "$r"/ffmpeg-build-*.txt "$work/ffmpeg-$FFMPEG_VERSION/"
          # And the script and options that made it, so the source alone
          # tells how (item 6).
          mkdir "$work/ffmpeg-$FFMPEG_VERSION/zajil-build"
          cp tools/ffmpeg/build.sh tools/ffmpeg/configure-dist.txt tools/ffmpeg/source.env \
            .github/workflows/ffmpeg.yml "$work/ffmpeg-$FFMPEG_VERSION/zajil-build/"
          tar -cJf "$r/ffmpeg-$FFMPEG_VERSION-zajil-source.tar.xz" -C "$work" "ffmpeg-$FFMPEG_VERSION"
          # The LGPL, and FFmpeg's own notes on the licenses of its parts.
          cp "$work/ffmpeg-$FFMPEG_VERSION/COPYING.LGPLv2.1" "$work/ffmpeg-$FFMPEG_VERSION/LICENSE.md" "$r/"
          (cd "$r" && sha256sum * > SHA256SUMS)
          cat "$r/SHA256SUMS"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . tools/ffmpeg/source.env
          {
            echo "FFmpeg $FFMPEG_VERSION for Zajil: ffmpeg and ffprobe, LGPL 2.1 or later."
            echo
            echo "This software uses code of FFmpeg licensed under the LGPLv2.1 and its source can be downloaded here: $FFMPEG_TARBALL (with its signature $FFMPEG_TARBALL.asc), and ffmpeg-$FFMPEG_VERSION-zajil-source.tar.xz, the same source with the build notes of every platform in its root."
            echo
            echo "Source SHA-256: $FFMPEG_SHA256 ($FFMPEG_TARBALL, signed by FFmpeg's key $FFMPEG_SIGNING_KEY)."
            echo
            echo "macOS: ad-hoc signed only, never signed or notarized by Apple (owner's decision). Zajil pins each file's SHA-256 and checks it before running it (ADR-0009)."
            echo
            echo "No change to the FFmpeg source. Built by .github/workflows/ffmpeg.yml from commit $GITHUB_SHA. FFmpeg belongs to its authors: https://ffmpeg.org"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "FFmpeg $FFMPEG_VERSION for Zajil ($GITHUB_REF_NAME)" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/release/*
